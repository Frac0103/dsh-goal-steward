name: verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Must NOT pass --legacy-peer-deps: the real-composition tests mount the
      # published host service packages, which arrive as peer dependencies.
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: node scripts/check.mjs
      - name: Unit, mock-host and real-composition tests
        run: node --test
