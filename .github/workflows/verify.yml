name: verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Must NOT pass --legacy-peer-deps: the real-composition tests mount the
      # published host service packages, which arrive as peer dependencies.
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: node scripts/check.mjs
      - name: Unit, mock-host and real-composition tests (Node 20)
        if: matrix.node == '20'
        run: node --test
      # Node 22.8+ can enforce coverage thresholds. The line gate is tight on
      # purpose. Branch/function gates stay slightly looser because Node 22 and
      # 24 instrument test files differently (Node 22 counts test-file closures,
      # Node 24 does not) — the same suite measures ~1.5 points lower on 22.
      - name: Tests with coverage gates (Node 22+)
        if: matrix.node != '20'
        run: >-
          node --experimental-test-coverage
          --test-coverage-lines=99
          --test-coverage-branches=85
          --test-coverage-functions=95
          --test
